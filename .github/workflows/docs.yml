name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/manual/**"
      - "docs/design/**"
      - "ROADMAP.md"
      - "ROADMAP_COMPLETE.md"
      - "scripts/sync-planning-docs.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt
      - name: Sync planning documents into the docs tree
        run: python3 scripts/sync-planning-docs.py
      - name: Build documentation
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
